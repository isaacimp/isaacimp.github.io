<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Articles, videos, and posts I've read and saved.">
<link rel="canonical" href="https://isaacmp.xyz/bookmarks.html">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:title" content="Bookmarks — Isaac">
<meta property="og:description" content="Articles, videos, and posts I've read and saved.">
<meta property="og:url" content="https://isaacmp.xyz/bookmarks.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Bookmarks — Isaac">

<meta name="theme-color" content="#F5F2EA">
<meta name="theme-color" content="#17171A" media="(prefers-color-scheme: dark)">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <a href="index.html" class="back">&larr; isaacmp.xyz</a>

  <section id="bookmarks">
    <h2>Bookmarks</h2>
    <p>Things I've read, watched, enjoyed, and saved — I keep them here so people can see what I've liked, and so that I can go back to them anytime. It's also a way to reduce the number of tabs cluttering my browser.</p>


    <div class="bookmark-filters" id="bookmark-filters"></div>
    <div id="bookmark-list"></div>
  </section>
</main>

<script src="bookmarks-data.js"></script>
<script>
  const list = document.getElementById('bookmark-list');
  const filters = document.getElementById('bookmark-filters');
  let activeType = 'all';

  function hostname(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (e) { return ''; }
  }

  function render() {
    list.innerHTML = '';
    const entries = BOOKMARKS.filter(b => activeType === 'all' || (b.type || 'link') === activeType);
    entries.forEach(entry => {
      const type = entry.type || 'link';
      const item = document.createElement('div');
      item.className = 'bookmark-entry';
      item.innerHTML = `
        <div class="bookmark-entry-title"><a href="${entry.url}">${entry.title}</a></div>
        <div class="bookmark-entry-meta">
          <span class="bookmark-entry-type">${type}</span>
          <span>${hostname(entry.url)}</span>
          <time datetime="${entry.date}">${entry.date}</time>
        </div>
        ${entry.note ? `<p class="bookmark-entry-note">${entry.note}</p>` : ''}
        ${entry.enhancedUrl ? `<div class="bookmark-entry-enhanced"><a href="${entry.enhancedUrl}">view enhanced version</a> · <a href="${entry.enhancedUrl}" download>download</a></div>` : ''}
      `;
      list.appendChild(item);
    });
    if (!entries.length) {
      list.innerHTML = '<p class="bookmark-empty">Nothing here yet.</p>';
    }
  }

  function renderFilters() {
    const types = ['all', ...new Set(BOOKMARKS.map(b => b.type || 'link'))];
    filters.innerHTML = '';
    types.forEach(type => {
      const btn = document.createElement('button');
      btn.className = 'bookmark-filter-btn' + (type === activeType ? ' active' : '');
      btn.textContent = type;
      btn.addEventListener('click', () => {
        activeType = type;
        filters.querySelectorAll('.bookmark-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
      filters.appendChild(btn);
    });
  }

  renderFilters();
  render();
</script>
<script src="/search.js"></script>
<script src="/theme.js"></script>

</body>
</html>
