<body>

<main>
  <a href="../index.html#posts" class="back">&larr; isaacmp.xyz</a>

  <section id="posts-list">
    <h2>Posts</h2>
    <ul class="plain" id="posts-index"></ul>
  </section>
</main>

<script src="../posts-data.js"></script>
<script>
  function tagLinksHtml(tags) {
    if (!tags || !tags.length) return '';
    const chips = tags.map(t => `<a class="tag" href="/tags.html?t=${encodeURIComponent(t)}">${t}</a>`).join('');
    return `<span class="tags">${chips}</span>`;
  }

  const list = document.getElementById('posts-index');
  if (POSTS.length) {
    list.innerHTML = POSTS.map(post =>
      `<li><a href="${post.slug}.html">${post.title}</a> - <em>${post.date}</em> ${tagLinksHtml(post.tags)}</li>`
    ).join('');
  } else {
    list.outerHTML = '<p><em>No posts yet — check back soon.</em></p>';
  }
</script>
<script src="/search.js"></script>
</body>
