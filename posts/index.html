<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts — Isaac</title>
<meta name="description" content="Short ideas, longer thoughts, and random things — everything smaller and less refined than an article.">
<link rel="canonical" href="https://isaacmp.xyz/posts/">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:title" content="Posts — Isaac">
<meta property="og:description" content="Short ideas, longer thoughts, and random things — everything smaller and less refined than an article.">
<meta property="og:url" content="https://isaacmp.xyz/posts/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Posts — Isaac">
<meta name="twitter:description" content="Short ideas, longer thoughts, and random things — everything smaller and less refined than an article.">

<meta name="theme-color" content="#F7F7F5">
<meta name="theme-color" content="#17171A" media="(prefers-color-scheme: dark)">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<main>
  <a href="https://isaacmp.xyz" class="back">&larr; isaacmp.xyz</a>

  <section id="posts-list">
    <h2>Posts</h2>
    <div id="posts-index"></div>
  </section>
</main>

<script src="../posts-data.js"></script>
<script>
  // Every post's full content, stacked newest-first as a feed — fetched
  // from each post's own standalone page so there's still just one copy
  // of the text (same approach the homepage uses for just the latest
  // post). Long posts are clipped with a fade and expand in place on
  // "Show more" rather than navigating away.
  const container = document.getElementById('posts-index');
  const COLLAPSED_HEIGHT = 480;

  function tagLinksHtml(tags) {
    if (!tags || !tags.length) return '';
    const chips = tags.map(t => `<a class="tag" href="/tags.html?t=${encodeURIComponent(t)}">${t}</a>`).join('');
    return `<span class="tags">${chips}</span>`;
  }

  if (!POSTS.length) {
    container.outerHTML = '<p><em>No posts yet — check back soon.</em></p>';
  } else {
    POSTS.forEach(post => {
      const entry = document.createElement('div');
      entry.className = 'feed-entry';
      entry.id = 'post-' + post.slug;
      entry.innerHTML = `
        <a class="feed-entry-title" href="${post.slug}.html">${post.title}</a>
        <div class="feed-entry-meta">
          <time datetime="${post.date}">${post.date}</time>
          ${tagLinksHtml(post.tags)}
        </div>
        <div class="feed-entry-body-wrap">
          <article class="article-content"><p><em>Loading…</em></p></article>
          <div class="feed-entry-fade" hidden></div>
        </div>
        <button class="feed-entry-more" hidden>Show more ⌄</button>
      `;
      container.appendChild(entry);

      const wrap = entry.querySelector('.feed-entry-body-wrap');
      const article = entry.querySelector('.article-content');
      const fade = entry.querySelector('.feed-entry-fade');
      const moreBtn = entry.querySelector('.feed-entry-more');
      let expanded = false;

      fetch(`${post.slug}.html`)
        .then(res => res.ok ? res.text() : Promise.reject(res))
        .then(html => {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          const body = temp.querySelector('#post-body');
          if (!body) throw new Error('post-body not found');
          const header = body.querySelector('.article-header');
          if (header) header.remove();
          article.innerHTML = body.innerHTML;

          requestAnimationFrame(() => {
            const fullHeight = article.scrollHeight;
            if (fullHeight > COLLAPSED_HEIGHT + 100) {
              wrap.style.maxHeight = COLLAPSED_HEIGHT + 'px';
              fade.hidden = false;
              moreBtn.hidden = false;
              moreBtn.addEventListener('click', () => {
                expanded = !expanded;
                if (expanded) {
                  wrap.style.maxHeight = fullHeight + 'px';
                  fade.hidden = true;
                  moreBtn.textContent = 'Show less ⌃';
                } else {
                  wrap.style.maxHeight = COLLAPSED_HEIGHT + 'px';
                  fade.hidden = false;
                  moreBtn.textContent = 'Show more ⌄';
                  entry.scrollIntoView({ block: 'start', behavior: 'smooth' });
                }
              });
            }
          });
        })
        .catch(() => {
          article.innerHTML = `<p><a href="${post.slug}.html">${post.title}</a> — <em>${post.date}</em>. <a href="${post.slug}.html">Read it →</a></p>`;
        });
    });
  }
</script>
<script src="/back.js"></script>
<script src="/search.js"></script>
</body>
</html>
