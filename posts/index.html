<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts — Isaac</title>
<meta name="description" content="Short ideas, longer thoughts, and random things — everything smaller and less refined than an article.">
<link rel="canonical" href="https://isaacmp.xyz/posts/">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:title" content="Posts — Isaac">
<meta property="og:description" content="Short ideas, longer thoughts, and random things — everything smaller and less refined than an article.">
<meta property="og:url" content="https://isaacmp.xyz/posts/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Posts — Isaac">
<meta name="twitter:description" content="Short ideas, longer thoughts, and random things — everything smaller and less refined than an article.">

<meta name="theme-color" content="#F5F2EA">
<meta name="theme-color" content="#17171A" media="(prefers-color-scheme: dark)">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<main>
  <a href="https://isaacmp.xyz" class="back">&larr; isaacmp.xyz</a>

  <section id="posts-list">
    <h2>Posts</h2>
    <div id="posts-index"></div>
  </section>
</main>

<script src="../posts-data.js"></script>
<script>
  // Every post's full content, stacked newest-first — fetched from each
  // post's own standalone page so there's still just one copy of the text
  // (same approach the homepage uses for just the latest post).
  const container = document.getElementById('posts-index');

  if (!POSTS.length) {
    container.outerHTML = '<p><em>No posts yet — check back soon.</em></p>';
  } else {
    POSTS.forEach(post => {
      const holder = document.createElement('div');
      holder.id = 'post-' + post.slug;
      container.appendChild(holder);

      fetch(`${post.slug}.html`)
        .then(res => res.ok ? res.text() : Promise.reject(res))
        .then(html => {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          const body = temp.querySelector('#post-body');
          if (!body) throw new Error('post-body not found');
          const article = document.createElement('article');
          article.className = 'article-content';
          article.innerHTML = body.innerHTML;
          const permalink = document.createElement('p');
          permalink.innerHTML = `<a href="${post.slug}.html">Permalink →</a>`;
          article.appendChild(permalink);
          holder.replaceChildren(article);
        })
        .catch(() => {
          holder.innerHTML = `<p><a href="${post.slug}.html">${post.title}</a> — <em>${post.date}</em>. <a href="${post.slug}.html">Read it →</a></p>`;
        });
    });
  }
</script>
<script src="/search.js"></script>
<script src="/theme.js"></script>
</body>
</html>
