<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 1. Update the title, description, canonical URL, and OG/Twitter tags below. -->
<title>Your Post Title — Isaac</title>
<meta name="description" content="One sentence summarizing the post.">
<link rel="canonical" href="https://isaacmp.xyz/posts/your-slug.html">
<!-- Leave this as noindex on the template itself; switch to "index, follow"
     once you've copied this file and filled in a real post. -->
<meta name="robots" content="noindex, nofollow">

<meta property="og:type" content="article">
<meta property="og:title" content="Your Post Title">
<meta property="og:description" content="Same as the meta description above.">
<meta property="og:url" content="https://isaacmp.xyz/posts/your-slug.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Your Post Title">
<meta name="twitter:description" content="Same as the meta description above.">

<meta name="theme-color" content="#F5F2EA">
<meta name="theme-color" content="#17171A" media="(prefers-color-scheme: dark)">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">

<!-- 2. Update the headline/datePublished below (helps eligibility for rich search results). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "Your Post Title",
  "datePublished": "2026-08-06",
  "author": { "@type": "Person", "name": "Isaac Morris-Perrott", "url": "https://isaacmp.xyz/" }
}
</script>
</head>
<body>

<main>
  <a href="../index.html#posts" class="back">&larr; isaacmp.xyz</a>

  <!-- 3. Write the post. id="post-body" is what the homepage fetches to show
       the full latest post there without duplicating it — don't rename it.
       Same .article-content formatting as articles: p / h3 / ul / ol /
       blockquote / pre+code / hr / img / table all just work, but posts can
       be as short as a single paragraph. -->
  <article class="article-content" id="post-body">
    <header class="article-header">
      <h3>Your Post Title</h3>
      <!-- Add as many <a class="tag"> chips as you want inside .tags — each
           links to /tags.html?t=<tag>, which lists every post/article that
           shares that tag (matched case-insensitively). -->
      <p class="article-meta"><time datetime="2026-08-06">Aug 6, 2026</time> <span class="tags"><a class="tag" href="/tags.html?t=idea">idea</a></span></p>
    </header>

    <p>Write the post here. Can be a single paragraph or several — there's no minimum length.</p>
  </article>

  <p><a href="index.html">&larr; all posts</a></p>
</main>

<script src="/search.js"></script>
<script src="/theme.js"></script>
</body>
</html>
