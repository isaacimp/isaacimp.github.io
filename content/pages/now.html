<script src="../now-data.js"></script>
<script>
  const list = document.getElementById('now-list');
  NOW_ENTRIES.forEach(entry => {
    const block = document.createElement('div');
    block.className = 'now-entry';
    block.id = 'now-' + entry.date;
    block.innerHTML = `<p class="now-entry-date"><time datetime="${entry.date}">${entry.date}</time></p>${entry.html}`;
    list.appendChild(block);
  });
</script>
