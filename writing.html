<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — Isaac</title>
<meta name="description" content="Articles and posts, filterable by type and tag.">
<link rel="canonical" href="https://isaacmp.xyz/writing.html">
<meta name="robots" content="index, follow">

<meta property="og:type" content="website">
<meta property="og:title" content="Writing — Isaac">
<meta property="og:description" content="Articles and posts, filterable by type and tag.">
<meta property="og:url" content="https://isaacmp.xyz/writing.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Writing — Isaac">
<meta name="twitter:description" content="Articles and posts, filterable by type and tag.">

<meta name="theme-color" content="#F7F7F5">
<meta name="theme-color" content="#17171A" media="(prefers-color-scheme: dark)">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <a href="https://isaacmp.xyz" class="back">&larr; isaacmp.xyz</a>

  <section id="writing">
    <h2>Writing</h2>
    <p>Everything I've written — fleshed-out articles and shorter posts, together in one place.</p>

    <div class="bookmark-filters" id="writing-type-filters"></div>
    <div class="bookmark-filters" id="writing-tag-filters"></div>
    <div id="writing-list"></div>
  </section>
</main>

<script src="articles-data.js"></script>
<script src="posts-data.js"></script>
<script>
  const list = document.getElementById('writing-list');
  const typeFilters = document.getElementById('writing-type-filters');
  const tagFilters = document.getElementById('writing-tag-filters');
  let activeType = 'all';
  const activeTags = new Set();

  const ENTRIES = []
    .concat((typeof ARTICLES !== 'undefined' ? ARTICLES : []).map(a => ({
      type: 'article',
      title: a.title,
      date: a.date,
      url: a.file,
      tags: a.tags || []
    })))
    .concat((typeof POSTS !== 'undefined' ? POSTS : []).map(p => ({
      type: 'post',
      title: p.title,
      date: p.date,
      url: `posts/${p.slug}.html`,
      tags: p.tags || []
    })))
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  function tagLinksHtml(tags) {
    if (!tags || !tags.length) return '';
    const chips = tags.map(t => `<span class="tag">${t}</span>`).join('');
    return `<span class="tags">${chips}</span>`;
  }

  function render() {
    list.innerHTML = '';
    const entries = ENTRIES.filter(e => {
      if (activeType !== 'all' && e.type !== activeType) return false;
      if (activeTags.size && !e.tags.some(t => activeTags.has(t))) return false;
      return true;
    });
    entries.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'bookmark-entry';
      item.innerHTML = `
        <div class="bookmark-entry-title"><a href="${entry.url}">${entry.title}</a></div>
        <div class="bookmark-entry-meta">
          <span class="bookmark-entry-type">${entry.type}</span>
          <time datetime="${entry.date}">${entry.date}</time>
          ${tagLinksHtml(entry.tags)}
        </div>
      `;
      list.appendChild(item);
    });
    if (!entries.length) {
      list.innerHTML = '<p class="bookmark-empty">Nothing here yet.</p>';
    }
  }

  function renderTypeFilters() {
    const types = ['all', 'article', 'post'];
    typeFilters.innerHTML = '';
    types.forEach(type => {
      const btn = document.createElement('button');
      btn.className = 'bookmark-filter-btn' + (type === activeType ? ' active' : '');
      btn.textContent = type === 'all' ? 'all' : type + 's';
      btn.addEventListener('click', () => {
        activeType = type;
        typeFilters.querySelectorAll('.bookmark-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
      typeFilters.appendChild(btn);
    });
  }

  function renderTagFilters() {
    const tags = [...new Set(ENTRIES.flatMap(e => e.tags))].sort();
    tagFilters.innerHTML = '';
    tags.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'bookmark-filter-btn';
      btn.textContent = tag;
      btn.addEventListener('click', () => {
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
          btn.classList.remove('active');
        } else {
          activeTags.add(tag);
          btn.classList.add('active');
        }
        render();
      });
      tagFilters.appendChild(btn);
    });
  }

  renderTypeFilters();
  renderTagFilters();
  render();
</script>
<script src="/search.js"></script>

</body>
</html>
